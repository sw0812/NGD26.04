controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - link1_to_link2
      - link2_to_wheel
      - wheel_to_lift

arm_controller:
  ros__parameters:
    joints:
      - link1_to_link2
    interface_name: position
controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: position_controllers/JointGroupPositionController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - link1_to_link2
      - link2_to_wheel
      - wheel_to_lift
      - base_to_left_wheel
      - base_to_right_wheel

arm_controller:
  ros__parameters:
    joints:
      - link1_to_link2
    interface_name: position

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_to_left_wheel"]
    right_wheel_names: ["base_to_right_wheel"]
    wheel_separation: 0.24
    wheel_radius: 0.05
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
